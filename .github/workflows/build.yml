name: Build firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: idf.py build (esp32c5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32c5
          path: "."
